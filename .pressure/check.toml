scope = "repo"

[[checks]]
id = "craftax_guarded_mbx_build"
description = "Craftax image compilation uses mbx and the maintained target storage guard"
severity = "error"
file_contains = [
  { path = "docker/craftax-eval-target/Dockerfile", pattern = "storage_target_guard.py" },
  { path = "docker/craftax-eval-target/Dockerfile", pattern = "/usr/local/bin/mbx build" },
  { path = "docker/craftax-eval-target/build.py", pattern = "core_dev_build.py" },
]
remedy = "Keep the host admission launcher, 8 GiB target guard and mbx in the Craftax build path."

[[checks]]
id = "eval_pinned_local_image"
description = "Pinned eval images prefer verified local identity and never pull during a trial"
severity = "error"
file_contains = [
  { path = "src/synth_optimizers/eval/executor.py", pattern = "if digest == image_id:" },
  { path = "src/synth_optimizers/eval/executor.py", pattern = "--pull=never" },
]
remedy = "Restore local image ID precedence over matching RepoDigest and the explicit no-pull trial launch. Run the existing executor regressions."

[[checks]]
id = "craftax_llm_plan_retention"
description = "Full-trace Craftax runs retain the rest of each paid model plan"
severity = "error"
file_contains = [
  { path = "docker/shared/llm_policy.py", pattern = '_STATE["pending_actions"] = plan[1:]' },
  { path = "tests/test_eval_runner.py", pattern = "test_full_trace_consumes_the_whole_llm_plan_before_another_call" },
]
remedy = "Preserve per-episode plan retention and qualify that every planned action executes before the next paid call."

[[checks]]
id = "craftax_canonical_survival_evidence"
description = "Benchmark Craftax uses the pinned frontend agent, survival rules and fail-closed evidence gates"
severity = "error"
require_paths = ["docker/shared/canonical_sweep.py", "docker/shared/canonical_verification.py"]
file_contains = [
  { path = "docker/shared/canonical_policy.py", pattern = "from suites.nonproduct.craftax.harness import ReActHarness" },
  { path = "docker/shared/canonical_sweep.py", pattern = 'if decision.get("stop_episode"):' },
  { path = "docker/craftax-eval-target/target.py", pattern = '"symbolic_survival"' },
  { path = "docker/shared/canonical_verification.py", pattern = "'episode_complete':complete" },
  { path = "docker/craftax-eval-target/build.py", pattern = 'GameBench must match the canonical frontend harness source pin' },
]
remedy = "Restore actual frontend harness/source identity and survival/completion/coverage checks. Qualify the trusted native driver before paying for model calls; never weaken the arbitrary code-policy sandbox."

[[checks]]
id = "craftax_effort_matrix"
description = "Forty-rollout Luna effort comparison declares all treatments and bounded per-trial budgets"
severity = "error"
file_contains = [
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.luna6-efforts.react-survival.v1.toml", pattern = 'efforts = ["low", "medium", "high", "xhigh"]' },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.luna6-efforts.react-survival.v1.toml", pattern = "max_parallel_trials = 40" },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.luna6-efforts.react-survival.v1.toml", pattern = "max_llm_calls = 128" },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.luna6-efforts.react-survival.v1.toml", pattern = "max_usd = 0.50" },
]
remedy = "Preserve explicit effort allowlist, concurrency and per-trial limits; requalify all forty native policy configurations before changing this matrix."

[[checks]]
id = "craftax_beam_image_reference"
description = "Beam recipe resolves its catalogue image without repointing the Luna image tag"
severity = "error"
file_contains = [
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.beam1-efforts.react-survival.v1.toml", pattern = 'image = "craftax-eval-target:beam-reasoning-20261019"' },
]
remedy = "Preserve the distinct Beam image reference and verify OciTrialExecutor.resolve_reference plus EvalRunner._validate_inputs against the actual pinned image before publishing a launcher command."

[[checks]]
id = "craftax_matched_two_dollar_recipes"
description = "Direct Reflection and OpenRouter Luna declare matched two-dollar per-rollout budgets"
severity = "error"
file_contains = [
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.luna6-efforts.react-survival-2usd.v1.toml", pattern = "max_usd = 2.0" },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.reflection-efforts.react-survival-2usd.v1.toml", pattern = "max_usd = 2.0" },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.reflection-efforts.react-survival-2usd.v1.toml", pattern = 'secret = "REFLECTION_API_KEY"' },
  { path = "src/synth_optimizers/eval/catalog/eval.craftax.reflection-efforts.react-survival-2usd.v1.toml", pattern = "https://api.reflection.ai/openai/v1/chat/completions" },
]
remedy = "Keep provider identity and pricing provenance explicit; verify real worker inputs, forty seeds/configurations and multi-turn provider continuation before publishing commands."
