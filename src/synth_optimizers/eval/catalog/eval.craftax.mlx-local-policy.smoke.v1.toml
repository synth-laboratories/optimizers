[recipe]
id = "eval.craftax.mlx-local-policy.smoke.v1"
title = "Craftax local MLX policy smoke"
description = "Score the Workshop-owned local MLX base policy on pinned Craftax, report only."
task = "craftax"
policy_kind = "llm-policy.v1"
image = "craftax-eval-target"
prerequisites = ["Pinned local Craftax target", "Workshop-managed Qwen/Qwen3.5-2B MLX inference"]
scenarios = ["craftax-default-48x48"]
screening_seeds = [91001, 91002, 91003, 91004, 91005, 91006, 91007, 91008, 91009, 91010]
confirmation_seeds = []
secrets = ["SYNTH_MLX_RL_TOKEN"]

[recipe.budget]
max_llm_calls = 4
max_usd = 0.01

[[recipe.models]]
id = "mlx-local-base"
route = "http://host.docker.internal:8787/v1/chat/completions"
secret = "SYNTH_MLX_RL_TOKEN"
efforts = []
usd_per_1m_input = 0.0
usd_per_1m_output = 0.0
usd_per_1m_cached_input = 0.0
price_source = "local-compute"
price_as_of = "2026-08-26"

[recipe.target]
schema_version = "eval.target.v1"
policy_kinds = ["llm-policy.v1"]
trial_mode = "one-policy-one-seed"
required_gates = ["policy_loaded", "verifier_completed"]
required_artifacts = ["trace", "replay"]
supports_live_events = true
network = "bridge"

[[recipe.target.metrics]]
id = "reward"
direction = "maximize"

[[recipe.target.metrics]]
id = "achievements"
direction = "maximize"

[recipe.selection]
primary_metric = "reward"
min_lift = 0.0
min_valid_trials = 10
decision_mode = "report_only"

[recipe.selection.elimination]
kind = "none"

[recipe.limits]
max_parallel_trials = 10
timeout_seconds = 900
cpus = 1.0
memory_mb = 1024
max_output_bytes = 268435456
