name: Publish Craftax eval target

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Optimizers producer
        uses: actions/checkout@v4

      - name: Check out pinned GameBench source
        uses: actions/checkout@v4
        with:
          repository: synth-laboratories/gamebench-ship1-source
          ref: 1b27362954cc903db76a3d2c3ed5c9bb80301de1
          path: gamebench-source

      - name: Assemble immutable build context
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/craftax-eval-target"
          mkdir -p "$stage/gamebench/tasks/craftax-singleplayer" "$stage/gamebench/tasks/shared"
          cp docker/craftax-eval-target/Dockerfile docker/craftax-eval-target/target.py "$stage/"
          cp -R docker/shared "$stage/shared"
          rsync -a --exclude '__pycache__' --exclude '.pytest_cache' --exclude 'target/' \
            gamebench-source/tasks/craftax-singleplayer/ "$stage/gamebench/tasks/craftax-singleplayer/"
          rsync -a --exclude '__pycache__' \
            gamebench-source/tasks/shared/ "$stage/gamebench/tasks/shared/"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable multi-architecture target
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/craftax-eval-target
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/synth-laboratories/workshop-craftax-eval-target:v0.5-gamebench-1b273629
          labels: |
            org.opencontainers.image.source=https://github.com/synth-laboratories/optimizers
            org.opencontainers.image.revision=1b27362954cc903db76a3d2c3ed5c9bb80301de1
            org.opencontainers.image.title=Workshop Craftax eval target
          build-args: |
            GAMEBENCH_SOURCE_COMMIT=1b27362954cc903db76a3d2c3ed5c9bb80301de1
          provenance: mode=max
          sbom: true

      - name: Record immutable publication receipt
        run: |
          printf '%s\n' \
            'image=ghcr.io/synth-laboratories/workshop-craftax-eval-target' \
            'source_revision=1b27362954cc903db76a3d2c3ed5c9bb80301de1' \
            'architectures=linux/amd64,linux/arm64' \
            'digest=${{ steps.publish.outputs.digest }}' | tee craftax-eval-target-receipt.txt

      - uses: actions/upload-artifact@v4
        with:
          name: craftax-eval-target-receipt
          path: craftax-eval-target-receipt.txt

      # GitHub has no REST route for package visibility: PATCH
      # /orgs/{org}/packages/container/{name} is 404 for every token, which is
      # what failed runs 32094428767 and 32098386835 after the push succeeded.
      # Visibility is a one-time package-settings action by an org owner, so
      # verify it here instead of pretending to set it. Once the package is
      # public this step passes on every later run.
      - name: Verify the target is anonymously pullable
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          repo='synth-laboratories/workshop-craftax-eval-target'
          token="$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "::error::ghcr.io/${repo} is not anonymously pullable. The image ${DIGEST} was pushed and its receipt uploaded; an org owner must set the package public once at https://github.com/orgs/synth-laboratories/packages/container/workshop-craftax-eval-target/settings (Danger Zone -> Change visibility -> Public)."
            exit 1
          fi
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${DIGEST}"
          echo "anonymous pull verified for ${DIGEST}"
