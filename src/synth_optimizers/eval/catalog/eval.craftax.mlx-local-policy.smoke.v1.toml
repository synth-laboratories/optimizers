[recipe]
id = "eval.craftax.mlx-local-policy.smoke.v1"
title = "Craftax local MLX prompt comparison"
description = "Compare bounded Craftax prompt variants through Workshop's managed local MLX endpoint."
task = "craftax"
policy_kind = "llm-policy.v1"
image = "craftax-eval-target"
prerequisites = ["Pinned local Craftax target", "Workshop-managed Qwen/Qwen3.5-0.8B MLX inference"]
scenarios = ["craftax-policy-dev-9x9"]
screening_seeds = [101, 102]
confirmation_seeds = []
secrets = ["SYNTH_MLX_RL_TOKEN"]

[recipe.budget]
max_llm_calls = 8
max_usd = 0.01

[[recipe.models]]
id = "mlx-local-base"
route = "http://host.docker.internal:8787/v1/chat/completions"
secret = "SYNTH_MLX_RL_TOKEN"
efforts = []
usd_per_1m_input = 0.0
usd_per_1m_output = 0.0
usd_per_1m_cached_input = 0.0
price_source = "local-compute"
price_as_of = "2026-08-24"

[recipe.target]
schema_version = "eval.target.v1"
policy_kinds = ["llm-policy.v1"]
trial_mode = "one-policy-one-seed"
required_gates = ["policy_loaded", "verifier_completed"]
required_artifacts = ["trace", "replay"]
supports_live_events = true
network = "bridge"

[[recipe.target.metrics]]
id = "reward"
direction = "maximize"

[[recipe.target.metrics]]
id = "achievements"
direction = "maximize"

[recipe.selection]
primary_metric = "reward"
min_lift = 0.0
min_valid_trials = 2
decision_mode = "report_only"

[recipe.selection.elimination]
kind = "none"

[recipe.limits]
max_parallel_trials = 1
timeout_seconds = 600
cpus = 2.0
memory_mb = 4096
max_output_bytes = 268435456
