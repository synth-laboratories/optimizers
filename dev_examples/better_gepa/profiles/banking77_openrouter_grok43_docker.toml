# Banking77 acceptance profile — OpenRouter Grok 4.3 Docker proposer.
# Requires an explicitly minted scoped gateway session.

[policy]
provider = "openai"
model = "gpt-4.1-nano"
gateway_session = "gateway-session://env"

[proposer]
backend = "codex_app_server"
runtime_substrate = "docker"
execution_mode = "local_process"
provider = "openrouter"
auth_mode = "gateway_session"
gateway_session = "gateway-session://env"
copy_host_auth = false
model = "x-ai/grok-4.3"
reasoning_effort = "medium"
timeout_seconds = 900
sandbox_mode = "workspace-write"
approval_policy = "never"

[proposer.docker]
image = "ghcr.io/synth-laboratories/codex-gepa-proposer:2026-05-31"
workspace_mount_path = "/workspace"
network = "bridge"
extra_env = {}
