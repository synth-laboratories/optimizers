# Real native engine in a small combat fixture. Report-only event acceptance.
[recipe]
id = "eval.craftax.events.smoke.v1"
title = "Craftax terminal-event fixture"
description = "Prove health/death streaming in a zombie arena; not benchmark evidence."
task = "craftax"
policy_kind = "python-code.craftax-choose-actions.v1"
image = "craftax-eval-target"
prerequisites = ["Pinned local Craftax target image with terminal fixture"]
scenarios = ["craftax-terminal-fixture"]
screening_seeds = [101, 102]
confirmation_seeds = []
secrets = []

[recipe.target]
schema_version = "eval.target.v1"
policy_kinds = ["python-code.craftax-choose-actions.v1"]
trial_mode = "one-policy-one-seed"
required_gates = ["policy_loaded", "verifier_completed"]
required_artifacts = ["trace"]
supports_live_events = true
network = "none"

[[recipe.target.metrics]]
id = "reward"
direction = "maximize"

[[recipe.target.metrics]]
id = "achievements"
direction = "maximize"

[recipe.selection]
primary_metric = "reward"
min_lift = 0.0
min_valid_trials = 1
decision_mode = "report_only"

[recipe.selection.elimination]
kind = "none"

[recipe.limits]
max_parallel_trials = 2
timeout_seconds = 60
cpus = 1.0
memory_mb = 1024
max_output_bytes = 67108864
