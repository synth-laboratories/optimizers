[run]
run_id = "crafter_gepa_public"
output_dir = "runs"
seed = 0

[container]
url = "http://127.0.0.1:8770"
command = [
  "/usr/bin/env",
  "CRAFTER_POLICY_MODEL=gemini-3.1-flash-lite",
  "CRAFTER_POLICY_API_KEY_ENV=GEMINI_API_KEY",
  "CRAFTER_POLICY_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/",
  "CRAFTER_MAX_TURNS=12",
  "CRAFTER_MIN_BATCH=1",
  "CRAFTER_MAX_BATCH=5",
  "uv", "run", "--project", ".",
  "python", "synth_service_app.py",
  "--host", "127.0.0.1", "--port", "8770",
]
cwd = "."
startup_timeout_seconds = 60

[taskset]
train_split = "train"
heldout_split = "test"
train_ids = ["train:11", "train:12", "train:13"]
heldout_ids = ["test:101", "test:102"]

[candidate]
target_modules = ["react_system_prompt"]

[seed_candidate]
react_system_prompt = "You are a Crafter survival-game policy. Each turn, choose exactly one action from the admissible action list. Return ONLY strict JSON: {\"action\": \"<action_name>\"}. Prioritize achievements: collect resources with do, place a table before crafting tools, craft pickaxes before mining harder materials, eat or sleep when survival is low, and avoid repeating actions that the latest observation says failed."

[policy]
provider = "google"
model = "gemini-3.1-flash-lite"
api_key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"

[proposer]
backend = "codex_app_server"
execution_mode = "local_process"
timeout_seconds = 900
model = "gpt-5.4-nano"
reasoning_effort = "medium"
auth_mode = "api_key"
copy_host_auth = false
api_key_env = "OPENAI_API_KEY"
sandbox_mode = "workspace-write"
approval_policy = "never"

[gepa]
max_generations = 1
proposals_per_generation = 1
minibatch_size = 2
max_total_rollouts = 12
max_cost_usd = 0.0

[gepa.pipeline]
mode = "async_pipelined"
max_in_flight_candidates = 1

[gepa.pipeline.workers]
rollout = 5

[gepa.pipeline.adaptive_rollout_concurrency]
enabled = true
initial = 5
min = 1
max = 10
increase_step = 2
decrease_step = 2
increase_after_successes = 10

[cache]
mode = "readwrite"
path = "runs/crafter_gepa_cache.sqlite"
namespace = "crafter_gepa_public_live"
