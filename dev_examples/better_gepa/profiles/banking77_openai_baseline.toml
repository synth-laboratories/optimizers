# Banking77 acceptance profile — OpenAI API policy + proposer (baseline).
# Harness: banking77_synth_gepa_dev.py container + merge _termination_limits.toml
# Ref: better-ai-auth.txt §10.3 openai_baseline

[policy]
provider = "openai"
model = "gpt-4.1-nano"
api_key_env = "OPENAI_API_KEY"

[proposer]
backend = "codex_app_server"
runtime_substrate = "local"
execution_mode = "local_process"
provider = "openai"
auth_mode = "api_key"
api_key_env = "OPENAI_API_KEY"
copy_host_auth = false
model = "gpt-5.4-mini"
reasoning_effort = "medium"
timeout_seconds = 900
sandbox_mode = "workspace-write"
approval_policy = "never"
