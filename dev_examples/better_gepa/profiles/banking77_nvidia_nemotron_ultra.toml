# Banking77 acceptance profile — NVIDIA Nemotron 3 Ultra proposer (non-free, direct NVIDIA API).
# Uses the direct chat-completions proposer backend, NOT codex: NVIDIA's
# integrate.api.nvidia.com serves /chat/completions only, and Codex removed chat-wire
# support (github.com/openai/codex/discussions/7782) — it speaks the Responses wire only.
# (If you don't have an NVIDIA key, use the openrouter_nemotron_ultra profile instead —
# OpenRouter hosts the same paid model and proxies the Responses wire through Codex.)
# Requires an explicitly minted scoped gateway session.

[policy]
provider = "openai"
model = "gpt-4.1-nano"
gateway_session = "gateway-session://env"

[proposer]
backend = "gateway_responses"
base_url = "gateway-session://env"
execution_mode = "local_process"
provider = "nvidia"
auth_mode = "gateway_session"
gateway_session = "gateway-session://env"
copy_host_auth = false
model = "nvidia/nemotron-3-ultra-550b-a55b"
allow_unverified_model = true
reasoning_effort = "medium"
timeout_seconds = 1200
