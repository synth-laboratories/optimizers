[project]
name = "craftax-levers"
version = "0.0.1"
description = "Craftax-shaped GEPA containers: code policy_script and ReAct policy service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
craftax-levers-code = "craftax_levers.stack:main_code"
craftax-levers-react = "craftax_levers.stack:main_react"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craftax_levers"]
