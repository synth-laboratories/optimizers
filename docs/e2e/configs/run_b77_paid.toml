schema_version = "cispo.container.v1"
run_id = "b77_paid_floor_01"

[container]
url = "http://127.0.0.1:8241"

[taskset]
train_split = "train"
evaluation_split = "train"
train_ids = ["banking77/train/0", "banking77/train/2", "banking77/train/3"]
evaluation_ids = []

[model]
provider = "tinker"
id = "openai/gpt-oss-20b"
family = "gpt_oss"
policy_kind = "banking77_classify"

[plan]
preset = "cispo"
group_size = 2
groups_per_step = 3
target_train_updates = 1
maximum_sampled_groups = 3

[pipeline]
max_execution_slots = 6
rollout_queue_capacity = 12
score_queue_capacity = 12
scored_result_queue_capacity = 12
train_ready_capacity = 1
maximum_policy_lag = 0
max_open_groups = 3
expected_horizon_seconds = 60.0
stale_disposition = "discard"

[topology]
expected_topology_id = "banking77.classify.solo.v1"
trainable_teams = ["team-0"]
partial_roster = "refuse"

[opponents]
match_set_revision = "match-set-0001"

[reward]
optimized_channel = "score"

[evaluation]
paired = false

[lifecycle]
resume_requires_rehandshake = true

[offline]
mode = "off"

[artifacts]
catalog = "/tmp/synth-container-first-e2e/banking77-paid/checkpoints.sqlite3"
directory = "/tmp/synth-container-first-e2e/banking77-paid/runs"
