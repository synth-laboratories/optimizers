schema_version = "cispo.container.v1"
run_id = "tbl_paid_floor_05"

[container]
url = "http://127.0.0.1:8244"
timeout_seconds = 600.0

[taskset]
train_split = "train"
evaluation_split = "train"
train_ids = ["tblite/jsonl-aggregator"]
evaluation_ids = []

[model]
provider = "tinker"
id = "openai/gpt-oss-20b"
family = "gpt_oss"
policy_kind = "tblite_mini_swe"

[plan]
preset = "cispo"
group_size = 2
groups_per_step = 3
target_train_updates = 1
maximum_sampled_groups = 3

[pipeline]
max_execution_slots = 6
rollout_queue_capacity = 12
score_queue_capacity = 12
scored_result_queue_capacity = 12
train_ready_capacity = 1
maximum_policy_lag = 0
max_open_groups = 3
expected_horizon_seconds = 3600.0
stale_disposition = "discard"

[topology]
expected_topology_id = "tblite.mini_swe.solo.v1"
trainable_teams = ["team-0"]
partial_roster = "refuse"

[opponents]
match_set_revision = "match-set-0001"

[reward]
optimized_channel = "score"

[evaluation]
paired = false

[lifecycle]
resume_requires_rehandshake = true

[offline]
mode = "off"

[artifacts]
catalog = "/tmp/synth-container-first-e2e/tblite-paid-05/checkpoints.sqlite3"
directory = "/tmp/synth-container-first-e2e/tblite-paid-05/runs"
