[profile]
name = "deepseek_v4_flash"
description = "MiniGrid GEPA run using DeepSeek v4 Flash on an easier navigation-only task with more train/heldout seeds than smoke."

[base]
config = "gepa.toml"
run_id = "minigrid_deepseek_v4_flash"

[policy]
provider = "deepseek"
model = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"

[proposer]
model = "gpt-5.4-nano"
auth_mode = "api_key"
api_key_env = "OPENAI_API_KEY"
copy_host_auth = false

[task]
env_id = "MiniGrid-Empty-Random-6x6-v0"
max_steps = 24

[taskset]
train_size = 8
heldout_size = 4
train_task_id_start = 1
heldout_task_id_start = 100

[pipeline]
max_generations = 3
proposals_per_generation = 6
minibatch_size = 4
max_in_flight_candidates = 6
rollout_workers = 4
rollout_chunk_size = "auto"

[pipeline.adaptive_rollout_concurrency]
enabled = true
initial = 4
min = 1
max = 8
increase_step = 2
decrease_step = 2
increase_after_successes = 10

[budgets]
train_rollouts = 220
heldout_rollouts = 16

[timeouts]
container_http_seconds = 180
rollout_async_seconds = 180
rollout_http_retries = 0
