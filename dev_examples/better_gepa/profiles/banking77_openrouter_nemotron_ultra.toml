# Banking77 acceptance profile — OpenRouter NVIDIA Nemotron 3 Ultra proposer via Codex.
# Requires an explicitly minted scoped gateway session.
# Provider: Nvidia, 1M ctx, tools+reasoning. Uses the PAID variant (no :free suffix;
# ~$0.50/M in, $2.50/M out) for real throughput; OpenRouter proxies the Codex Responses
# wire so no NVIDIA key or chat-wire is needed. Swap to `...a55b:free` for the throttled tier.

[policy]
provider = "openai"
model = "gpt-4.1-nano"
gateway_session = "gateway-session://env"

[proposer]
backend = "codex_app_server"
runtime_substrate = "local"
execution_mode = "local_process"
provider = "openrouter"
auth_mode = "gateway_session"
gateway_session = "gateway-session://env"
copy_host_auth = false
model = "nvidia/nemotron-3-ultra-550b-a55b"
allow_unverified_model = true
reasoning_effort = "low"
timeout_seconds = 900
sandbox_mode = "workspace-write"
approval_policy = "never"
