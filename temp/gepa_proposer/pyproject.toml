[project]
name = "gepa-proposer"
version = "0.0.1"
description = "Temp GEPA proposer eval/RL http_task container"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gepa-proposer = "gepa_proposer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gepa_proposer"]
